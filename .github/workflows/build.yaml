name: Build Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          onefile: false
          mode: onefile
          windows-disable-console: true
          output-filename: eq_persona_hotbar_fixer.exe

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eq_persona_hotbar_fixer-windows
          path: build/eq_persona_hotbar_fixer.exe

      - name: Create Release and Attach EXE (On Version Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/eq_persona_hotbar_fixer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}