name: Build Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          # Compiles PyInstaller bootloader from source to help bypass false-positive antivirus triggers
          pip install --no-binary pyinstaller pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --noupx --name "eq_persona_hotbar_fixer" main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eq_persona_hotbar_fixer-windows
          path: dist/*.exe

      - name: Create Release and Attach EXE (On Version Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}